<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stylepag.css') }}">
</head>
<body>
    <h1>Editar Utilizador: {{ usuario.nome }}</h1>

    <form method="POST">
        <label>Nome:</label>
        <input type="text" name="nome" value="{{ usuario.nome }}" required><br><br>

        <label>E-mail:</label>
        <input type="email" name="email" value="{{ usuario.email }}" required><br><br>

        <label>Telefone:</label>
        <input type="text" name="telefone" value="{{ usuario.telefone }}" required><br><br>

        <button type="submit">Salvar Alterações</button>
    </form>

    <br>
    <a href="{{ url_for('editar') }}">Cancelar</a>
</body>
</html>
